<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title><!--__TITLE__--></title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Diseño: portada destacada a pantalla ancha, barra de secciones fija y filas horizontales de tarjetas por día y horario, como un catálogo de streaming. Una sola mirada oscura, azul marino con amarillo y blanco. */
:root{
  --bg:#050507; --bg2:#0D0D12; --surface:#111116; --surface2:#1B1B22;
  --fg:#F5F5F7; --muted:#A4A4B0; --line:#2C2C36;
  --accent:#FF2447; --accent2:#8E1028; --on-accent:#FFFFFF; --glow:rgba(255,36,71,.55);
  --danger:#FFB020; --danger-bg:#2A1E08;
  --font-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --font-body:'Barlow',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1360px;margin:0 auto}
.full{margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}

/* portada */
.hero{position:relative;min-height:min(78vh,560px);display:flex;flex-direction:column;overflow:hidden;border-bottom:5px solid var(--accent)}
.hero-art{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity .5s}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,5,8,.92) 0%,rgba(5,5,8,.65) 45%,rgba(5,5,8,.05) 100%),linear-gradient(0deg,var(--bg) 0%,rgba(5,5,8,0) 35%)}
.nav{position:relative;z-index:2;padding-block:16px}
.nav .wrap{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:.06em;text-transform:uppercase;line-height:1;margin-right:auto}
.brand b{color:var(--accent);font-weight:700}
.search input{width:min(240px,42vw);background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);border-radius:8px;padding:8px 12px;color:var(--fg);font:inherit}
.search input::placeholder{color:#D0D0D8}
.agenda-btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:8px;padding:9px 14px;font-weight:600;display:flex;gap:8px;align-items:center;white-space:nowrap}
.agenda-btn b{background:var(--bg);color:#fff;border-radius:99px;min-width:24px;padding:1px 8px;text-align:center;font-variant-numeric:tabular-nums}
.hero-body{position:relative;z-index:2;margin-top:auto;padding-block:40px 56px}
.hero-body .wrap{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.kicker{font-family:var(--font-display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:15px;color:var(--accent)}
.hero h1{font-family:var(--font-display);font-weight:700;font-size:clamp(38px,7vw,76px);line-height:.95;margin:0;text-transform:uppercase;max-width:20ch;text-wrap:balance}
.hero p{margin:0;max-width:56ch;font-size:clamp(16px,2vw,19px);color:#E8E8EE}
.hero-meta{display:flex;gap:10px;flex-wrap:wrap;color:#E8E8EE;font-weight:500}
.hero-meta span{background:rgba(255,255,255,.14);border-radius:6px;padding:3px 10px}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.btn{border:0;border-radius:8px;padding:11px 20px;font-weight:600;font-size:16px;display:inline-flex;gap:8px;align-items:center;text-decoration:none}
.btn.y{background:var(--accent);color:var(--on-accent)}
.btn.y:hover{background:#FF5470}
.btn.g{background:rgba(255,255,255,.18);color:#fff}
.btn.g:hover{background:rgba(255,255,255,.28)}
.btn.in{background:#fff;color:#08080C}
.btn.clash{background:transparent;border:2px solid var(--danger);color:var(--danger)}
.btn:disabled{background:rgba(255,255,255,.1);color:var(--muted);cursor:not-allowed}
.dots{position:absolute;z-index:3;right:max(16px,env(safe-area-inset-right,0px));bottom:20px;display:flex;gap:8px}
.dots button{width:34px;height:5px;border:0;border-radius:3px;background:rgba(255,255,255,.35);padding:0}
.dots button[aria-current="true"]{background:var(--accent)}

/* barra de secciones */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(5,5,8,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar .wrap{padding-block:10px}
.tabs,.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0}
.tabs::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.tab{flex:none;background:transparent;border:0;border-bottom:3px solid transparent;border-radius:0;padding:8px 14px;font-family:var(--font-display);font-weight:600;font-size:19px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tab[aria-pressed="true"]{color:#fff;border-bottom-color:var(--accent)}
.tab:hover{color:#fff}
.tab .n{font-family:var(--font-body);font-size:12px;opacity:.7;margin-left:6px;letter-spacing:0}
.chips{padding-top:8px}
.chip{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.chip.sep{width:1px;padding:0;background:var(--line);border:0;align-self:stretch;margin-inline:4px}

/* filas */
.row{padding-top:26px}
.row-head{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}
.row-head h2{font-family:var(--font-display);font-weight:700;font-size:28px;line-height:1;margin:0;text-transform:uppercase;letter-spacing:.03em}
.row-head .sub{color:var(--muted);font-weight:500}
.row-head .count{margin-left:auto;color:var(--muted);font-size:13px}
.arrows{display:flex;gap:6px}
.arrows button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1}
.arrows button:hover{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
@media (hover:none){.arrows{display:none}}
.scroller{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;padding:8px 2px 18px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.empty{color:var(--muted);padding:40px 0}

/* tarjeta */
.card{flex:none;width:300px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s}
.card:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 14px 30px rgba(0,0,0,.5);border-color:var(--accent)}
.card.past{opacity:.5}
.thumb{position:relative;aspect-ratio:16/9;background-size:cover;background-position:center}
.thumb .time{position:absolute;left:10px;bottom:8px;font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:.03em;font-variant-numeric:tabular-nums;text-shadow:0 2px 8px rgba(0,0,0,.7)}
.tags{position:absolute;left:8px;top:8px;right:56px;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:rgba(5,5,8,.82);color:#fff}
.tag.v{background:var(--accent);color:var(--on-accent)}
.tag.m{background:#fff;color:#08080C}
.plus{position:absolute;right:10px;bottom:10px;width:40px;height:40px;border-radius:50%;border:2px solid #fff;background:rgba(5,5,8,.65);color:#fff;font-size:24px;line-height:1;display:grid;place-items:center;padding:0}
.plus:hover{background:#fff;color:#08080C}
.plus.in{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-size:20px;font-weight:700}
.plus.clash{border-color:var(--danger);color:var(--danger);font-size:20px;font-weight:700}
.cbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
.ctitle{font-weight:600;font-size:16px;line-height:1.25;margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}
.cmeta{margin:0;color:var(--accent);font-size:13px;font-weight:500}
.cdesc{margin:0;color:var(--muted);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* avisos */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;pointer-events:none;z-index:80;max-width:min(540px,calc(100vw - 32px));padding:13px 18px;border-radius:10px;font-weight:500;box-shadow:0 8px 28px rgba(0,0,0,.5);background:var(--surface2);color:#fff;border-left:6px solid var(--accent);transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--danger-bg);border:1px solid var(--danger);border-left:6px solid var(--danger)}

/* detalle y agenda */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.scrim[hidden]{display:none}
.sheet-wrap{position:relative;width:min(660px,100%)}
.sheet{background:var(--surface);width:100%;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);border:1px solid var(--line)}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:14px;max-height:90vh}}
.close{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(5,5,8,.8);color:#fff;font-size:22px;line-height:1;z-index:3}
.s-art{position:relative;aspect-ratio:16/8;background-size:cover;background-position:center}
.s-art::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--surface) 0%,rgba(14,33,69,0) 60%)}
.s-in{padding:0 22px 22px;display:flex;flex-direction:column;gap:14px;margin-top:-36px;position:relative;z-index:2}
.s-in h3{font-family:var(--font-display);font-size:clamp(28px,5vw,38px);line-height:1;margin:0;text-transform:uppercase;text-wrap:balance}
.s-in .lead{margin:0;font-size:16.5px;color:#E8E8EE}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px;margin:0;border-top:1px solid var(--line);padding-top:16px}
.facts dt{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.facts dd{margin:2px 0 0;font-weight:500;overflow-wrap:anywhere}
.note{background:var(--danger-bg);border-left:4px solid var(--danger);padding:10px 12px;border-radius:0 8px 8px 0;font-size:14px}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}
.ag-head{background:linear-gradient(135deg,var(--bg2),var(--accent2));padding:22px;border-bottom:5px solid var(--accent)}
.ag-head h3{font-family:var(--font-display);font-size:34px;line-height:1;margin:4px 0 0;text-transform:uppercase}
.ag-in{padding:6px 20px 22px;display:flex;flex-direction:column;gap:10px}
.ag-day{font-family:var(--font-display);font-size:21px;text-transform:uppercase;margin:14px 0 0;color:var(--accent);letter-spacing:.04em}
.ag-item{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg2)}
.ag-item .t{font-family:var(--font-display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;min-width:100px}
.ag-item div{min-width:0}
.ag-item strong{display:block;font-weight:600}
.ag-item small{color:var(--muted)}
.ag-item .x{margin-left:auto;background:transparent;border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:13px}
.ag-item .x:hover{border-color:var(--danger);color:var(--danger)}
.muted{color:var(--muted)}
.foot{margin-top:40px;color:var(--muted);font-size:12.5px}
@media (max-width:640px){.arrows{display:none}.row-head h2{font-size:24px}.row-head{flex-wrap:wrap;gap:4px 10px}}
@media (max-width:520px){.card{width:260px}.brand{font-size:19px;flex:1 1 100%}.search{flex:1 1 0;min-width:0}.search input{width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<header class="hero full" id="hero">
  <div class="hero-art" id="heroArt"></div>
  <div class="nav"><div class="wrap">
    <div class="brand"><b>XXXII</b> Semana de Ingeniería</div>
    <div class="search"><input id="q" type="search" placeholder="Buscar" aria-label="Buscar actividades"></div>
    <button class="agenda-btn" id="openAgenda" type="button">Mi agenda <b id="agCount">0</b></button>
  </div></div>

<nav class="bar full" aria-label="Secciones"><div class="wrap">

</div></nav>

<main class="wrap"><div id="rows"></div>
  <p class="foot"><!--__FOOT__--></p>
</main>

<div class="scrim" id="detail" hidden><div class="sheet-wrap"><button class="close" id="closeDetail" aria-label="Cerrar" type="button">×</button><div class="sheet" id="detailBody" role="dialog" aria-modal="true" aria-label="Detalle de la actividad"></div></div></div>
<div class="scrim" id="agenda" hidden><div class="sheet-wrap"><button class="close" id="closeAgenda" aria-label="Cerrar" type="button">×</button><div class="sheet" id="agendaBody" role="dialog" aria-modal="true" aria-label="Mi agenda"></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const NOW = /*__NOW__*/new Date();
const ACTS = /*__ACTS__*/[];
const MONTHS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DAYN=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const dparts=s=>{const d=new Date(s+'T12:00:00');return {n:DAYN[d.getDay()],short:DAYN[d.getDay()].slice(0,3),day:d.getDate(),mon:MONTHS[d.getMonth()]}};
const addDay=(s,k)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+k);return d.toISOString().slice(0,10)};
const ALLDAYS=/*__ALLDAYS__*/[];

const THEMES={
 ia:['Inteligencia artificial y datos','#08080C','#4A0A16'],
 electronica:['Electrónica y sensores','#08080C','#363640'],
 robot:['Robótica y competencias','#08080C','#7A1026'],
 software:['Software','#08080C','#42424D'],
 ciber:['Ciberseguridad','#08080C','#4A0A16'],
 bio:['Salud y biomédica','#08080C','#363640'],
 fisica:['Física y cuántica','#08080C','#7A1026'],
 mate:['Matemáticas','#08080C','#42424D'],
 materiales:['Materiales','#08080C','#4A0A16'],
 energia:['Energía','#08080C','#363640'],
 civil:['Ingeniería civil','#08080C','#7A1026'],
 geo:['Geociencias','#08080C','#42424D'],
 ambiente:['Ambiente y sustentabilidad','#08080C','#4A0A16'],
 industrial:['Industria y calidad','#08080C','#363640'],
 aero:['Aeronáutica','#08080C','#7A1026'],
 espacio:['Espacio','#08080C','#42424D'],
 carrera:['Carrera y empleo','#08080C','#4A0A16'],
 juego:['Juegos y rallies','#08080C','#363640'],
 deporte:['Deporte','#08080C','#7A1026'],
 cultura:['Cultura','#08080C','#42424D'],
 ceremonia:['Ceremonias','#08080C','#4A0A16'],
 general:['Semana de Ingeniería','#08080C','#363640']
};
const Y='#FF2447',W='#fff';
function gear(cx,cy,r,n,fill){let p=[];for(let i=0;i<n*2;i++){const a=Math.PI*2*i/(n*2),rr=i%2?r:r+9,a2=a+Math.PI/(n*2)*.0;p.push((cx+Math.cos(a)*rr).toFixed(1)+','+(cy+Math.sin(a)*rr).toFixed(1));}
  return `<polygon points="${p.join(' ')}" fill="${fill}" stroke="${Y}" stroke-width="2.5" stroke-linejoin="round"/><circle cx="${cx}" cy="${cy}" r="${r*.35}" fill="${Y}"/>`;}
const MOTIF={
 ia(){let L=[[70,[55,95,135]],[130,[35,75,115,155]],[190,[55,95,135]],[250,[75,115]]],s='';for(let i=0;i<L.length-1;i++)L[i][1].forEach(a=>L[i+1][1].forEach(b=>s+=`<line x1="${L[i][0]}" y1="${a}" x2="${L[i+1][0]}" y2="${b}" stroke="#fff" stroke-opacity=".28"/>`));
  L.forEach((c,i)=>c[1].forEach((y,j)=>s+=`<circle cx="${c[0]}" cy="${y}" r="8" fill="${(i+j)%3?W:Y}"/>`));return s;},
 electronica(){return `<rect x="125" y="55" width="70" height="70" rx="7" fill="#ffffff14" stroke="${Y}" stroke-width="3"/><rect x="143" y="73" width="34" height="34" rx="3" fill="${Y}"/>`+
  [135,150,165,180].map(x=>`<path d="M${x} 55V38M${x} 125V142" stroke="${Y}" stroke-width="3"/>`).join('')+
  `<g fill="none" stroke="${W}" stroke-opacity=".75" stroke-width="2.5" stroke-linejoin="round"><path d="M125 75H85L65 55H25"/><path d="M125 100H70L50 120H20"/><path d="M195 75H235L255 55H300"/><path d="M195 100H250L270 125H300"/><path d="M150 142V160H110M180 142V165H230"/></g><g fill="${Y}"><circle cx="25" cy="55" r="5"/><circle cx="20" cy="120" r="5"/><circle cx="300" cy="55" r="5"/><circle cx="300" cy="125" r="5"/><circle cx="110" cy="160" r="5"/><circle cx="230" cy="165" r="5"/></g>`;},
 robot(){return `<line x1="160" y1="42" x2="160" y2="22" stroke="${Y}" stroke-width="4"/><circle cx="160" cy="20" r="7" fill="${Y}"/><rect x="108" y="42" width="104" height="82" rx="18" fill="#ffffff18" stroke="${W}" stroke-width="3"/><rect x="95" y="68" width="12" height="30" rx="4" fill="${Y}"/><rect x="213" y="68" width="12" height="30" rx="4" fill="${Y}"/><circle cx="137" cy="80" r="13" fill="${Y}"/><circle cx="183" cy="80" r="13" fill="${Y}"/><circle cx="137" cy="80" r="5" fill="#08080C"/><circle cx="183" cy="80" r="5" fill="#08080C"/><path d="M135 104H185" stroke="${W}" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 7"/><path d="M118 140C130 160 190 160 202 140" fill="none" stroke="${W}" stroke-opacity=".5" stroke-width="3"/><g stroke="${W}" stroke-opacity=".3" stroke-width="2"><path d="M20 60H80M10 90H70M30 120H80M240 70H300M250 100H310"/></g>`;},
 software(){return `<rect x="60" y="30" width="200" height="120" rx="10" fill="#ffffff12" stroke="${W}" stroke-opacity=".8" stroke-width="3"/><path d="M60 52H260" stroke="${W}" stroke-opacity=".5" stroke-width="2"/><circle cx="76" cy="41" r="4" fill="${Y}"/><circle cx="90" cy="41" r="4" fill="${W}"/><circle cx="104" cy="41" r="4" fill="${W}" fill-opacity=".5"/>`+
  [[78,64,60,Y],[96,76,100,W],[96,88,70,W],[78,100,50,Y],[96,112,110,W],[96,124,40,Y]].map(r=>`<rect x="${r[0]+0}" y="${r[1]}" width="${r[2]}" height="7" rx="3.5" fill="${r[3]}" fill-opacity="${r[3]==Y?1:.7}"/>`).join('')+`<text x="225" y="120" font-family="monospace" font-size="52" font-weight="700" fill="${Y}" fill-opacity=".9">{}</text>`;},

const VAR=[{g:[60,140],t:'translate(0 0)'},{g:[260,40],t:'translate(8 -4) scale(1.02)'},{g:[210,150],t:'translate(-6 4)'}];
const STYLE_EL=document.createElement('style');document.head.appendChild(STYLE_EL);const made=new Set();
function artClass(theme,v){
  const key=`a-${theme}-${v}`; if(made.has(key)) return key; made.add(key);
  const T=THEMES[theme]||THEMES.general, vv=VAR[v];
  const grid=Array.from({length:9},(_,i)=>`<path d="M${i*40} 0V180M0 ${i*22}H320" stroke="#fff" stroke-opacity=".05"/>`).join('');
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${T[1]}"/><stop offset="1" stop-color="${T[2]}"/></linearGradient><radialGradient id="r"><stop offset="0" stop-color="#FF2447" stop-opacity=".5"/><stop offset="1" stop-color="#FF2447" stop-opacity="0"/></radialGradient><linearGradient id="v" x1="0" y1="0" x2="0" y2="1"><stop offset=".45" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity=".78"/></linearGradient></defs><rect width="320" height="180" fill="url(#g)"/><circle cx="${vv.g[0]}" cy="${vv.g[1]}" r="120" fill="url(#r)"/>${grid}<g transform="${vv.t}">${(MOTIF[theme]||MOTIF.general)()}</g><rect width="320" height="180" fill="url(#v)"/></svg>`;

const vOf=a=>[...a.id].reduce((h,c)=>h+c.charCodeAt(0),0)%3;
const artOf=a=>artClass(a.theme,vOf(a));

/* estado */
let tab='todas', fday=null, ftheme=null, query='', heroI=0;
let agenda=[];
try{agenda=JSON.parse(localStorage.getItem('semana-agenda-v2')||'[]').filter(id=>ACTS.some(a=>a.id===id));}catch(e){}
const save=()=>{try{localStorage.setItem('semana-agenda-v2',JSON.stringify(agenda));}catch(e){}};
const byId=id=>ACTS.find(a=>a.id===id);
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const TABS=[['todas','Todo'],['conf','Conferencias'],['taller','Talleres y cursos'],['concurso','Concursos'],['depcult','Deporte y cultura'],['virtual','Virtuales'],['otras','Otras']];
const matchTab=(a,t)=>t==='todas'||(t==='virtual'?a.virtual:a.cat===t);
const days=a=>{const r=[];let d=a.d1;while(d<=a.d2){r.push(d);d=addDay(d,1);}return r;};
const endDT=a=>new Date(a.d2+'T'+a.end+':00');
const finished=a=>endDT(a)<NOW;
const overlaps=(a,b)=>a.d1<=b.d2&&b.d1<=a.d2&&a.start<b.end&&b.start<a.end;
const clashWith=a=>agenda.map(byId).find(b=>b&&b.id!==a.id&&overlaps(a,b));
const rangeText=a=>{const p=dparts(a.d1),q=dparts(a.d2);return a.d1===a.d2?`${p.n} ${p.day} de ${p.mon}`:`${p.day} al ${q.day} de ${q.mon}`;};
const placeText=a=>a.virtual?'Virtual · Teams':(a.room?`Salón ${a.room}`:'Salón por confirmar');
const fmtT=a=>`${a.start}–${a.end}`;
function sharedDays(a,b){const x=days(a).filter(d=>days(b).includes(d));return x.map(d=>dparts(d).short+' '+dparts(d).day).join(', ');}

let toastT;
function toast(msg,err){const t=$('#toast');t.textContent=msg;t.className='toast show'+(err?' err':'');clearTimeout(toastT);toastT=setTimeout(()=>t.className='toast',5200);}

function state(a){
  if(finished(a)) return {k:'done'};
  if(agenda.includes(a.id)) return {k:'in'};
  if(clashWith(a)) return {k:'clash'};
  return {k:'add'};
}
function toggle(id){
  const a=byId(id);
  if(agenda.includes(id)){agenda=agenda.filter(x=>x!==id);save();toast('Quitaste esta actividad de tu agenda.');refresh();return;}
  if(finished(a)){toast('Esta actividad ya finalizó.',true);return;}
  const c=clashWith(a);
  if(c){toast(`No se puede agregar: coincide con «${c.title}» (${fmtT(c)}, ${sharedDays(a,c)}). Quítala primero si prefieres esta.`,true);return;}
  agenda.push(id);save();toast('Agregada a tu agenda.');refresh();
}

function cardHTML(a,day){
  const s=state(a), past=new Date(day+'T'+a.end+':00')<NOW;
  const tags=[`<span class="tag">${esc(a.type)}</span>`];
  if(a.virtual) tags.push('<span class="tag v">Virtual</span>');
  if(a.d1!==a.d2) tags.push(`<span class="tag m">${dparts(a.d1).day}–${dparts(a.d2).day} sept</span>`);
  const btn=s.k==='done'?'':`<button class="plus ${s.k==='in'?'in':s.k==='clash'?'clash':''}" data-go="${a.id}" type="button" aria-label="${s.k==='in'?'Quitar de mi agenda':'Voy a ir'}" title="${s.k==='in'?'En tu agenda. Toca para quitar':s.k==='clash'?'Coincide con tu agenda':'Voy a ir'}">${s.k==='in'?'✓':s.k==='clash'?'!':'+'}</button>`;
  return `<article class="card ${past?'past':''}" data-id="${a.id}" tabindex="0" role="button" aria-label="${esc(a.title)}, ${fmtT(a)}">
    <div class="thumb ${artOf(a)}"><div class="tags">${tags.join('')}</div><span class="time">${fmtT(a)}</span>${btn}</div>
    <div class="cbody"><h3 class="ctitle">${esc(a.title)}</h3><p class="cmeta">${esc(placeText(a))}</p><p class="cdesc">${esc(a.desc)}</p></div></article>`;
}
const slotOf=a=>a.start<'13:00'?['Mañana',0]:a.start<'18:00'?['Tarde',1]:['Noche',2];

function rowHTML(title,sub,items,day,key){
  return `<section class="row" aria-label="${esc(title+' '+sub)}"><div class="row-head"><h2>${esc(title)}</h2><span class="sub">${esc(sub)}</span><span class="count">${items.length}</span>
   <div class="arrows"><button type="button" data-scroll="${key}:-1" aria-label="Anterior">‹</button><button type="button" data-scroll="${key}:1" aria-label="Siguiente">›</button></div></div>
   <div class="scroller" data-key="${key}">${items.map(a=>cardHTML(a,day)).join('')}</div></section>`;
}
function render(){
  const sc={};document.querySelectorAll('.scroller').forEach(s=>sc[s.dataset.key]=s.scrollLeft);
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<button class="tab" type="button" data-tab="${k}" aria-pressed="${tab===k}">${l}<span class="n">${ACTS.filter(a=>matchTab(a,k)).length}</span></button>`).join('');
  const used=[...new Set(ACTS.map(a=>a.theme))].filter(t=>t!=='general').sort((x,y)=>THEMES[x][0].localeCompare(THEMES[y][0],'es'));
  $('#chips').innerHTML=ALLDAYS.map(d=>{const p=dparts(d);return `<button class="chip" type="button" data-day="${d}" aria-pressed="${fday===d}">${p.short} ${p.day}</button>`}).join('')+'<span class="chip sep"></span>'+
    used.map(t=>`<button class="chip" type="button" data-theme="${t}" aria-pressed="${ftheme===t}">${THEMES[t][0]}</button>`).join('');
  const q=query.trim().toLowerCase();
  const list=ACTS.filter(a=>matchTab(a,tab)&&(!ftheme||a.theme===ftheme)&&(!q||[a.title,a.speaker,a.inst,a.room,a.desc,a.type].join(' ').toLowerCase().includes(q)));
  let html='';
  if(tab==='todas'&&!fday&&!ftheme&&!q){
    const mag=ACTS.filter(a=>/magistral|patrimonial/i.test(a.type));
    if(mag.length) html+=rowHTML('Conferencias magistrales','Las charlas grandes de la semana',mag,mag[0].d1,'mag');
  }
  ALLDAYS.forEach(d=>{
    if(fday&&fday!==d) return;
    const items=list.filter(a=>a.d1<=d&&d<=a.d2).sort((x,y)=>x.start.localeCompare(y.start)||x.end.localeCompare(y.end));
    if(!items.length) return;
    const p=dparts(d);
    html+=rowHTML(`${p.n} ${p.day}`,`de ${p.mon}`,items,d,d);
  });
  $('#rows').innerHTML=html||'<p class="empty">No hay actividades con ese filtro.</p>';
  document.querySelectorAll('.scroller').forEach(s=>{if(sc[s.dataset.key])s.scrollLeft=sc[s.dataset.key];});
  $('#agCount').textContent=agenda.length;
}

/* portada */
const FEAT=/*__FEAT__*/[];
function hero(i){
  heroI=i;const a=byId(FEAT[i]);const s=state(a);
  $('#heroArt').className='hero-art '+artOf(a);
  const lab=s.k==='in'?'✓ En mi agenda':s.k==='clash'?'Coincide con tu agenda':s.k==='done'?'Finalizada':'+ Voy a ir';
  const cls=s.k==='in'?'in':s.k==='clash'?'clash':'y';
  $('#heroInfo').innerHTML=`<div class="kicker">Destacado · ${esc(a.type)}</div><h1>${esc(a.title)}</h1><p>${esc(a.desc)}</p>
   <div class="hero-meta"><span>${esc(rangeText(a))}</span><span>${fmtT(a)}</span><span>${esc(placeText(a))}</span></div>
   <div class="hero-cta"><button class="btn ${cls}" data-go="${a.id}" type="button" ${s.k==='done'?'disabled':''}>${lab}</button><button class="btn g" data-open="${a.id}" type="button">Más información</button></div>`;
  $('#dots').innerHTML=FEAT.map((_,j)=>`<button type="button" data-hero="${j}" aria-label="Destacado ${j+1}" ${j===i?'aria-current="true"':''}></button>`).join('');
}
let heroT;
function heroAuto(){clearInterval(heroT);if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;heroT=setInterval(()=>{if($('#detail').hidden&&$('#agenda').hidden)hero((heroI+1)%FEAT.length);},9000);}

function detail(id){
  const a=byId(id),s=state(a);
  let note='';
  const c=s.k==='clash'?clashWith(a):null;
  if(c) note=`<div class="note">Coincide con «${esc(c.title)}» de tu agenda (${fmtT(c)}, ${sharedDays(a,c)}).</div>`;
  const lab=s.k==='in'?'✓ En mi agenda · quitar':s.k==='clash'?'Coincide con tu agenda':s.k==='done'?'Finalizada':'+ Voy a ir';
  const cls=s.k==='in'?'in':s.k==='clash'?'clash':'y';
  const T=THEMES[a.theme][0];
  $('#detailBody').innerHTML=`<div class="s-art ${artOf(a)}"></div><div class="s-in">
    <div class="kicker">${esc(a.type)}${a.theme!=='general'?' · '+esc(T):''}</div><h3>${esc(a.title)}</h3><p class="lead">${esc(a.desc)}</p>${note}
    <dl class="facts">
      <div><dt>Fecha</dt><dd>${esc(rangeText(a))}${a.d1!==a.d2?' (todos los días)':''}</dd></div><div><dt>Horario</dt><dd>${fmtT(a)}</dd></div>
      <div><dt>Lugar</dt><dd>${a.virtual?'Virtual, por Teams':esc(a.room||'Por confirmar')}</dd></div><div><dt>Ponente</dt><dd>${esc(a.speaker||'Por confirmar')}</dd></div>
      <div><dt>Institución</dt><dd>${esc(a.inst||'Por confirmar')}</dd></div><div><dt>Maestro de ceremonias</dt><dd>${esc(a.mc||'Por confirmar')}</dd></div>
    </dl>
    <div class="row-btns"><button class="btn ${cls}" data-go="${a.id}" type="button" ${s.k==='done'?'disabled':''}>${lab}</button>
    ${a.virtual&&a.link?`<a class="btn g" href="${esc(a.link)}" target="_blank" rel="noopener">Entrar a Teams</a>`:''}</div></div>`;
  $('#detail').hidden=false;
}
function agendaView(){
  const items=agenda.map(byId).filter(Boolean).sort((x,y)=>(x.d1+x.start).localeCompare(y.d1+y.start));
  let h=`<div class="ag-head"><div class="kicker">Mi agenda</div><h3>${items.length?items.length+(items.length>1?' actividades':' actividad'):'Tu agenda está vacía'}</h3></div><div class="ag-in">`;
  if(!items.length)h+='<p class="muted">Toca el botón + de cualquier actividad para guardarla aquí. Las verás ordenadas por día y hora.</p>';
  let last='';
  items.forEach(a=>{if(a.d1!==last){const p=dparts(a.d1);h+=`<div class="ag-day">${p.n} ${p.day} de ${p.mon}</div>`;last=a.d1;}
    h+=`<div class="ag-item"><span class="t">${fmtT(a)}</span><div><strong>${esc(a.title)}</strong><small>${esc(placeText(a))}${a.d1!==a.d2?' · hasta el '+dparts(a.d2).day+' de '+dparts(a.d2).mon:''}</small></div><button class="x" data-rm="${a.id}" type="button">Quitar</button></div>`;});
  $('#agendaBody').innerHTML=h+'</div>';
}
function refresh(){render();hero(heroI);if(!$('#agenda').hidden)agendaView();if(!$('#detail').hidden){const id=$('#detailBody').querySelector('[data-go]')?.dataset.go;if(id)detail(id);}}

document.addEventListener('click',e=>{
  const t=e.target;
  const go=t.closest('[data-go]');if(go){e.stopPropagation();toggle(go.dataset.go);return;}
  const rm=t.closest('[data-rm]');if(rm){toggle(rm.dataset.rm);return;}
  const op=t.closest('[data-open]');if(op){detail(op.dataset.open);return;}
  const hb=t.closest('[data-hero]');if(hb){hero(+hb.dataset.hero);heroAuto();return;}
  const tb=t.closest('[data-tab]');if(tb){tab=tb.dataset.tab;render();return;}
  const dy=t.closest('[data-day]');if(dy){fday=fday===dy.dataset.day?null:dy.dataset.day;render();return;}
  const th=t.closest('[data-theme]');if(th){ftheme=ftheme===th.dataset.theme?null:th.dataset.theme;render();return;}
  const sc=t.closest('[data-scroll]');if(sc){const [k,dir]=sc.dataset.scroll.split(':');document.querySelector(`.scroller[data-key="${k}"]`).scrollBy({left:dir*620,behavior:'smooth'});return;}
  const card=t.closest('.card');if(card){detail(card.dataset.id);return;}
  if(t.closest('#openAgenda')){agendaView();$('#agenda').hidden=false;return;}
  if(t.id==='closeDetail'||t.id==='detail')$('#detail').hidden=true;
  if(t.id==='closeAgenda'||t.id==='agenda')$('#agenda').hidden=true;
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){$('#detail').hidden=true;$('#agenda').hidden=true;}
  if((e.key==='Enter'||e.key===' ')&&e.target.classList?.contains('card')){e.preventDefault();detail(e.target.dataset.id);}
});
$('#q').addEventListener('input',e=>{query=e.target.value;render();});
render();hero(0);heroAuto();
</script>

.tab[aria-pressed="true"]{text-shadow:0 0 14px var(--glow);border-bottom-color:var(--accent);box-shadow:0 8px 14px -10px var(--glow)}
.brand b{text-shadow:0 0 14px var(--glow)}
.btn.y,.agenda-btn,.chip[aria-pressed="true"],.plus.in{box-shadow:0 0 18px var(--glow)}
.btn.y:hover{box-shadow:0 0 28px var(--glow)}
.card:hover{box-shadow:0 0 0 1px var(--accent),0 10px 34px -4px var(--glow)}
.card.past:hover{box-shadow:none}
.plus{box-shadow:0 0 12px rgba(255,255,255,.25)}
.plus:hover{box-shadow:0 0 18px rgba(255,255,255,.6)}
.toast{border-left-color:var(--accent);box-shadow:0 0 24px rgba(255,36,71,.35)}
.dots button[aria-current="true"]{box-shadow:0 0 10px var(--glow)}
.ag-head{border-bottom-color:var(--accent);box-shadow:0 6px 24px -8px var(--glow)}
.hero::after{background:linear-gradient(90deg,rgba(5,5,8,.94) 0%,rgba(5,5,8,.7) 45%,rgba(5,5,8,.1) 100%),linear-gradient(0deg,var(--bg) 0%,rgba(5,5,8,0) 35%)}
</style>
