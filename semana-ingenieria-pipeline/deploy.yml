name: Procesar Excel y publicar en GitHub Pages

on:
  push:
    branches: [main]
    paths: [data/**, src/**, pipeline/**, build.py, config.json, requirements.txt]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ejecutar pipeline y generar sitio
        run: python build.py --resumen "$GITHUB_STEP_SUMMARY"
      - name: Guardar reportes (rechazados, bitácora, datos procesados)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes
          path: salida/
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
